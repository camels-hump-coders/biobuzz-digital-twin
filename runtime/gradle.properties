# Keep the build from taking the whole machine: the twin's host is a small project, and on a laptop it shares the CPU
# with the browser, the human's host and any headless twin-test runs. Fewer workers and a modest daemon heap cost a
# few seconds on a cold compile and nothing on a warm one.
org.gradle.jvmargs=-Xmx1g -XX:+UseParallelGC -XX:ParallelGCThreads=2
org.gradle.workers.max=4
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon.idletimeout=1800000
